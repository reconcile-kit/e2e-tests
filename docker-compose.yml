services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "55432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "56379:6379"

  state-manager:
    build:
      context: ./build/deps/state-manager
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://e2e:e2e@postgres:5432/e2e?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_SKIP_TLS: "true"
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "58080:8080"
